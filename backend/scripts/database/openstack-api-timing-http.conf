# Include at nginx http scope.
map $uri $eodiisseo_api_route {
    default other;
    ~^/api/v1/disasters/[^/]+/ai-summary$ disaster_summary;
    ~^/api/v1/disasters/[^/]+$ disaster_detail;
    ~^/api/v1/disasters$ disaster_list;
    ~^/api/v1/dashboard$ dashboard;
    ~^/api/v1/weather/current$ weather_current;
    ~^/api/v1/notification-settings$ notification_settings;
    ~^/api/v1/interest-areas$ interest_areas;
    ~^/api/v1/ai/guidance$ ai_guidance;
}
log_format eodiisseo_api_timing escape=json
    '{"time":"$time_iso8601","method":"$request_method","route":"$eodiisseo_api_route",'
    '"edge_id":"$request_id","trace_id":"$upstream_http_x_trace_id","status":$status,'
    '"request_time":$request_time,"upstream_status":"$upstream_status",'
    '"upstream_connect":"$upstream_connect_time","upstream_header":"$upstream_header_time",'
    '"upstream_response":"$upstream_response_time"}';
