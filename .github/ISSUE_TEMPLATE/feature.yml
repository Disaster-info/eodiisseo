name: ✨ 기능
description: 새 기능 개발
title: "[Feat] "
labels: ["feature"]
body:
  - type: input
    id: req
    attributes:
      label: 관련 요구사항 ID
      placeholder: FR-SHELTER-004, FR-SHELTER-005
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options: [mobile, backend, data, gis, ai, infra]
    validations:
      required: true
  - type: textarea
    id: desc
    attributes:
      label: 작업 내용
      description: 무엇을 만들어야 하는지
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 요구사항 분석서의 검증 기준을 옮겨 적어 주세요
      value: |
        - [ ]
