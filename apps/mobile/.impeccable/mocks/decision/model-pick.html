<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>기상특보 구역도</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#E8ECEF;color:#1B2A3A;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.status{height:47px;background:#1B2A3A}
.map{position:relative;height:380px;background:#1B2A3A;overflow:hidden}
.top{position:absolute;top:8px;left:16px;right:16px;display:flex;justify-content:space-between;color:#fff}
.top b{font-size:24px;font-weight:800}
.top span{font-size:13px;opacity:.7}
.cell{position:absolute;border:1.5px solid #1B2A3A}
.me{outline:3px solid #fff;outline-offset:-3px}
.pin{position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid #1B2A3A;left:198px;top:206px}
.legend{position:absolute;bottom:0;left:0;right:0;height:40px;background:rgba(27,42,58,.92);display:flex;align-items:center;gap:14px;padding:0 16px;color:#fff;font-size:12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.head{padding:16px}
.head h1{font-size:32px;font-weight:900;letter-spacing:-1px}
.head h1 em{font-style:normal;color:#E0442E}
.head p{font-size:15px;margin-top:6px;line-height:1.45}
.head small{display:block;margin-top:6px;font-size:12px;color:#6B7A88}
.btn{margin:4px 16px 0;height:52px;border-radius:10px;background:#1B2A3A;color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center}
.fam{margin:12px 16px 0;background:#fff;border-radius:10px;padding:14px;display:flex;justify-content:space-between;font-size:15px}
.fam b{font-weight:700}
.tab{position:absolute;bottom:0;left:0;right:0;height:83px;background:#fff;border-top:1px solid #CCD3D9;display:flex;justify-content:space-around;padding-top:10px;font-size:11px;color:#6B7A88}
.tab div{display:flex;flex-direction:column;align-items:center;gap:4px}
.tab i{width:24px;height:24px;border-radius:6px;background:#C2CAD1}
.tab .on{color:#1B2A3A;font-weight:700}.tab .on i{background:#1B2A3A}
</style></head><body>
<div class="status"></div>
<div class="map">
  <div class="top"><b>서울 강남구</b><span>특보 발표 현황</span></div>
  <div class="cell" style="left:40px;top:70px;width:120px;height:110px;background:#F2C230"></div>
  <div class="cell" style="left:160px;top:60px;width:110px;height:90px;background:#F2C230"></div>
  <div class="cell" style="left:270px;top:80px;width:90px;height:120px;background:#3A4B5C"></div>
  <div class="cell me" style="left:150px;top:150px;width:130px;height:120px;background:#E0442E"></div>
  <div class="cell" style="left:30px;top:180px;width:120px;height:130px;background:#E0442E"></div>
  <div class="cell" style="left:280px;top:200px;width:90px;height:110px;background:#F2C230"></div>
  <div class="cell" style="left:150px;top:270px;width:130px;height:70px;background:#3A4B5C"></div>
  <div class="pin"></div>
  <div class="legend"><span><i style="background:#E0442E"></i>경보</span><span><i style="background:#F2C230"></i>주의보</span><span><i style="background:#3A4B5C"></i>특보 없음</span><span style="margin-left:auto">13:40 기준</span></div>
</div>
<div class="head">
  <h1>강남구 <em>호우경보</em></h1>
  <p>시간당 50mm 이상 강한 비. 저지대·지하공간 출입을 피하세요.</p>
  <small>기상청 · 06:10 발표 · 진행중</small>
</div>
<div class="btn">가장 가까운 대피소 0.4km</div>
<div class="fam"><b>우리 가족</b><span style="color:#E0442E;font-weight:700">1명 영향지역 포함 ›</span></div>
<nav class="tab"><div class="on"><i></i>홈</div><div><i></i>대피소</div><div><i></i>안심그룹</div><div><i></i>체크리스트</div><div><i></i>내정보</div></nav>
</body></html>
