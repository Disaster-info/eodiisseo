<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>c-twolevel-account</title><style>:root{--bg:#E6EDF5;--card:#fff;--text:#16181B;--sub:#4E5B6A;--line:#D3DEEA;--accent:#0B5CAD;--soft:#DCE8F6;--danger:#B3201A;--dsoft:#FBE6E4;--ok:#0E7A4F;--rim:#000}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:100px;position:relative;min-height:844px}
.nav{height:96px;padding:50px 20px 0;font-size:28px;font-weight:800;letter-spacing:-.6px;background:#fff;border-bottom:.5px solid var(--line)}
.nav.sub{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}.nav.sub span{font-size:24px;font-weight:400;color:var(--accent)}
.wrap{padding:16px;display:flex;flex-direction:column;gap:8px}
.h{font-size:13px;font-weight:700;color:var(--sub);padding:12px 16px 2px}
.g{background:var(--card);border-radius:14px;padding:0 16px}
.r{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 0;border-top:.5px solid var(--line)}
.g .r:first-child{border-top:none}
.ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex:none;box-shadow:0 0 0 1.25px var(--rim)}
.t{flex:1;min-width:0}.t b{display:block;font-size:16px;font-weight:600}.t s{display:block;text-decoration:none;font-size:13px;color:var(--sub);margin-top:1px}
.v{font-size:15px;color:var(--sub);white-space:nowrap}.v.ok{color:var(--ok);font-weight:700}.v.link{color:var(--accent);font-weight:700}
.chev{color:#8A96A3;font-size:20px;margin-left:2px}
.sw{width:51px;height:31px;border-radius:16px;background:var(--accent);position:relative;flex:none}.sw:after{content:"";position:absolute;right:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.red b{color:var(--danger);font-weight:700}
.prof{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;padding:14px 16px}
.av{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1.25px var(--rim);flex:none}
.prof b{display:block;font-size:19px;font-weight:800}.prof s{display:block;text-decoration:none;font-size:14px;color:var(--sub);margin-top:2px}
.edit{margin-left:auto;font-size:14px;font-weight:700;color:var(--accent);padding:8px 12px;border-radius:999px;background:var(--soft);box-shadow:0 0 0 1.25px var(--rim);white-space:nowrap}
.pills{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:700;padding:7px 10px;border-radius:999px;background:var(--soft);color:var(--accent);box-shadow:0 0 0 1.25px var(--rim)}
.pill.ok{background:#E1F1E9;color:var(--ok)}
.seg{display:flex;background:#D4DFEB;border-radius:9px;padding:2px;gap:2px}
.seg i{font-style:normal;font-size:13px;font-weight:600;color:var(--sub);padding:6px 10px;border-radius:7px}.seg i.on{background:#fff;color:var(--text);font-weight:800;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.foot{font-size:13px;color:var(--sub);text-align:center;padding:8px}
.tab{position:absolute;bottom:0;left:0;right:0;height:83px;background:#fff;border-top:.5px solid var(--line);display:flex;justify-content:space-around;padding-top:10px;font-size:11px;color:var(--sub)}
.tab div{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px}.tab i{width:24px;height:24px;border-radius:7px;background:#B9C6D4}.tab .on{color:var(--accent);font-weight:700}.tab .on i{background:var(--accent)}</style></head><body><div class="nav sub"><span>‹</span>계정 관리</div><div class="wrap">
<div class="h">로그인 정보</div><div class="g"><div class="r "><span class="ic" style="background:#4E5B6A">메</span><div class="t"><b>이메일</b></div><span class="v">hong@example.com</span></div><div class="r "><span class="ic" style="background:#4E5B6A">가</span><div class="t"><b>가입일</b></div><span class="v">2026-09-01</span></div></div>
<div class="h">소셜 계정 연결</div><div class="g"><div class="r "><span class="ic" style="background:#4E5B6A">G</span><div class="t"><b>Google</b></div><span class="v">로그인 계정</span></div><div class="r "><span class="ic" style="background:#6B5A00">K</span><div class="t"><b>Kakao</b></div><span class="v link">연결하기</span></div></div>
<div class="g" style="margin-top:16px"><div class="r "><span class="ic" style="background:#4E5B6A">↪</span><div class="t"><b>로그아웃</b></div></div><div class="r red"><span class="ic" style="background:#B3201A">−</span><div class="t"><b>회원 탈퇴</b><s>모든 데이터 삭제 · 되돌릴 수 없어요</s></div><span class="chev">›</span></div></div></div></body></html>
