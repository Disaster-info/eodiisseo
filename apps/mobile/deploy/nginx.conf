# 웹 컨테이너의 nginx 설정: 웹 화면 파일 제공 + /api/ 요청을 백엔드 컨테이너로 전달
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  # font/ttf 등: 아이콘 글꼴(Ionicons.ttf, 약 380KB)도 압축 (nginx 버전에 따라 ttf 의 형식 이름이 달라 함께 적음)
  gzip_types text/css application/javascript application/json image/svg+xml font/ttf application/x-font-ttf application/font-sfnt;

  # 백엔드 API: 브라우저는 같은 주소(http://서버/api/...)로 요청하고, nginx 가 backend 컨테이너(8080)로 넘김
  # 주소를 변수로 두면 요청이 올 때 찾음 → 백엔드가 아직 없거나 꺼져 있어도 웹 화면은 뜸 (API 만 502)
  # 127.0.0.11 = Docker 내부 DNS (컨테이너 이름 'backend' 를 IP 로 바꿔 줌)
  resolver 127.0.0.11 valid=10s;
  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 빌드된 JS·폰트: 파일 이름에 내용 해시가 있어 내용이 바뀌면 이름도 바뀜 → 브라우저가 1년간 저장해도 안전
  location /_expo/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # 화면 주소(/shelter, /route/1 …)는 실제 파일이 없음 → index.html 을 주면 앱(Expo Router)이 주소를 보고 화면을 그림
  # index.html 은 매번 새로 확인(no-cache) → 새 버전을 배포하면 바로 반영
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
