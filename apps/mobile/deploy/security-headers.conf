# 모든 응답에 붙이는 보안 헤더 (nginx.conf 의 각 location 에서 include)
# nginx 는 location 안에 add_header 가 하나라도 있으면 server 단계의 add_header 를 물려받지 않음 → 파일로 빼서 location 마다 넣음
add_header X-Content-Type-Options "nosniff" always;                     # 파일 종류를 추측하지 않게 (JS 로 위장한 파일 실행 방지)
add_header X-Frame-Options "SAMEORIGIN" always;                         # 다른 사이트가 이 앱을 iframe 으로 감싸 속이는 것 방지
add_header Referrer-Policy "strict-origin-when-cross-origin" always;    # 다른 사이트로 이동할 때 전체 주소를 넘기지 않음
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always; # 위치는 이 사이트만, 카메라·마이크는 쓰지 않음
# HTTPS 를 켠 뒤에만 아래 줄의 # 을 지우세요 (브라우저가 이후 http 접속을 https 로 강제. http 만 있을 때 켜면 접속이 막힘)
# add_header Strict-Transport-Security "max-age=31536000" always;
